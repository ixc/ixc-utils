# fly.toml app configuration file generated for ic-web2-gunicorn on 2025-03-24T18:11:03+11:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#


app = "ixc-fly-time-sync-cs"
console_command = "/bin/sh -i"
primary_region = "syd"

[build]
image = "registry.fly.io/ixc-fly-time-sync-cs:current"

##[deploy]
### Use a bluegreen deployment strategy to avoid downtime
##strategy = "bluegreen"
##release_command = "s3-setup.sh"

[env]
TINI_SUBREAPER = "1"
PORT = "8000"

##[http_service]
##force_https = true
##internal_port = 8000
### This is the number of machines that will be running at all times
##min_machines_running = 1
### This tells fly to wake up machines in the scale group when the concurrency
### limit is reached
##auto_start_machines = true
### Integrity returns 502 errors when the machines are starting when using stop,
### however we have time issues when using suspend
##auto_stop_machines = "suspend"
##processes = ["gunicorn"]

##[[http_service.checks]]
##grace_period = "10s"
##interval = "30s"
##method = "GET"
##path = "/admin/login/"
##timeout = "5s"

##[http_service.checks.headers]
##Host = "ic-web2-gunicorn.fly.dev"

##[http_service.concurrency]
### This is the number of requests before the load balancer turns on another in
### the scale group
##soft_limit = 70
##type = "requests"

[http_service.http_options.response.headers]
X-Served_by = "fly.io"

[http_service.tls_options]
default_self_signed = false
versions = ["TLSv1.2", "TLSv1.3"]

##[processes]
##gunicorn = "supervisor.sh"

##[[statics]]
##guest_path = "/opt/ic-web2/static_root"
##url_prefix = "/static/"

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "1gb"
